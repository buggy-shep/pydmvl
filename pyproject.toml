[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydmvl"
version = "0.1.0"
description = "Unofficial Python client for the Domovladelets (homeowner) account API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The pydmvl contributors" }]
keywords = ["domovladelets", "homeowner", "home-automation", "utility-billing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/buggy-shep/pydmvl"
Repository = "https://github.com/buggy-shep/pydmvl"
Issues = "https://github.com/buggy-shep/pydmvl/issues"
Changelog = "https://github.com/buggy-shep/pydmvl/releases"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
release = [
    "build>=1.2",
    "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydmvl"]

[tool.hatch.build.targets.sdist]
exclude = [".kilo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: talks to the real account API; run manually only",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
